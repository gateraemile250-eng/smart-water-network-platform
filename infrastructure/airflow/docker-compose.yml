services:
  airflow-postgres:
    image: postgres:16
    container_name: smart-water-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - smart_water_airflow_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - airflow-internal


  airflow-init:
    image: smart-water-airflow:3.3.1-databricks
    container_name: smart-water-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    env_file:
      - ../postgres/.env

    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__TEST_CONNECTION: "Enabled"

      # Airflow's own metadata database
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

      # Airflow execution API
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://smart-water-airflow-apiserver:8080/execution/

      # Airflow JWT secret
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      # Smart Water application PostgreSQL database
      # JSON format avoids problems with special characters in the password.
      AIRFLOW_CONN_SMART_WATER_DB: >-
        {"conn_type":"postgres","host":"smart-water-postgres","port":5432,"schema":"${POSTGRES_DB}","login":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}"}

      # Smart Water project path
      SMART_WATER_PROJECT_PATH: "${SMART_WATER_PROJECT_PATH:?Set SMART_WATER_PROJECT_PATH in infrastructure/postgres/.env}"

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    command: db migrate

    networks:
      - airflow-internal
      - smart-water-network


  airflow-apiserver:
    image: smart-water-airflow:3.3.1-databricks
    container_name: smart-water-airflow-apiserver

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - ../postgres/.env

    environment:
      <<: *airflow-environment

      AWS_DEFAULT_REGION: eu-north-1
      AIRFLOW_CONN_AWS_DEFAULT: "aws:///?region_name=eu-north-1"

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro
      - "${SMART_WATER_PROJECT_PATH}:/opt/project"

    command: api-server

    ports:
      - "8081:8080"

    networks:
      - airflow-internal
      - smart-water-network


  airflow-scheduler:
    image: smart-water-airflow:3.3.1-databricks
    container_name: smart-water-airflow-scheduler

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - ../postgres/.env

    environment:
      <<: *airflow-environment

      AWS_DEFAULT_REGION: eu-north-1
      AIRFLOW_CONN_AWS_DEFAULT: "aws:///?region_name=eu-north-1"

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro
      - "${SMART_WATER_PROJECT_PATH}:/opt/project"

    command: scheduler

    networks:
      - airflow-internal
      - smart-water-network


  airflow-dag-processor:
    image: smart-water-airflow:3.3.1-databricks
    container_name: smart-water-airflow-dag-processor

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - ../postgres/.env

    environment:
      <<: *airflow-environment

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    command: dag-processor

    networks:
      - airflow-internal
      - smart-water-network


volumes:
  smart_water_airflow_db:
  airflow_logs:


networks:
  airflow-internal:

  smart-water-network:
    external: true